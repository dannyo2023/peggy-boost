<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A push from Peggy</title>
<style>
  :root{
    --cream:#F7F2EC;
    --ink:#211C1A;
    --gold:#B8923F;
    --blush:#E7B9B0;
    --line:#DED3C4;
    --card:#FFFFFF;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 18% 12%, rgba(184,146,63,0.10), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(231,185,176,0.18), transparent 50%),
      var(--cream);
    font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }

  .stage{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .kicker{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--gold);
    margin:0 0 6px;
    font-weight:600;
  }

  h1{
    font-size:26px;
    line-height:1.25;
    margin:0 0 28px;
    font-weight:500;
    letter-spacing:0.01em;
  }

  .bubble-wrap{
    position:relative;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .bubble{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 22px;
    min-height:34px;
    width:100%;
    max-width:320px;
    box-shadow:0 10px 30px -18px rgba(33,28,26,0.35);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.45;
    font-weight:500;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .35s ease, transform .35s ease;
    margin-bottom:-14px;
  }
  .bubble.show{opacity:1; transform:translateY(0);}
  .bubble::after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:16px;
    height:16px;
    background:var(--card);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .bubble-placeholder{ min-height:34px; margin-bottom:20px; }

  .photo-wrap{
    position:relative;
    width:236px;
    height:236px;
    margin-top:18px;
  }

  .photo-frame{
    width:236px;
    height:236px;
    border-radius:50%;
    padding:6px;
    background:linear-gradient(155deg, var(--gold), var(--blush));
    box-shadow:0 22px 45px -22px rgba(33,28,26,0.45);
    transform-origin:center;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:4px solid var(--cream);
  }

  .photo-frame.talking{
    animation: talk-sway 0.46s ease-in-out infinite;
  }
  .photo-frame.talking img{
    animation: talk-bob 0.46s ease-in-out infinite;
  }
  @keyframes talk-sway{
    0%, 100% { transform: rotate(0deg) scale(1); }
    25%      { transform: rotate(-3.2deg) scale(1.03); }
    50%      { transform: rotate(0deg) scale(1.055); }
    75%      { transform: rotate(3.2deg) scale(1.03); }
  }
  @keyframes talk-bob{
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.015); }
  }

  .talk-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:3px solid var(--gold);
    opacity:0;
    pointer-events:none;
  }
  .talk-ring.talking{
    animation: talk-pulse 0.8s ease-out infinite;
  }
  @keyframes talk-pulse{
    0%   { transform:scale(0.92); opacity:0.75; }
    100% { transform:scale(1.32); opacity:0; }
  }

  .cta{
    margin-top:34px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--cream);
    background:var(--ink);
    border:none;
    border-radius:999px;
    padding:15px 30px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 12px 24px -12px rgba(33,28,26,0.55);
  }
  .cta:active{transform:scale(0.96);}
  .cta:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .hint{
    margin-top:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:12.5px;
    color:#8A7F73;
  }

  .sound-toggle{
    margin-top:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease;
  }
  .sound-toggle:active{background:rgba(33,28,26,0.06);}
  .sound-toggle:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    .bubble{transition:none;}
    .cta{transition:none;}
    .photo-frame.talking,
    .photo-frame.talking img,
    .talk-ring.talking{
      animation:none;
    }
  }
</style>
</head>

    <button class="cta" id="ctaBtn">¿Necesitas un empujón?</button>

    <button class="sound-toggle" id="soundBtn" aria-pressed="true">
      <span id="soundIcon">🔊</span> <span id="soundLabel">Voice on</span>
    </button>

    <p class="hint">Tap it as many times as you like.</p>
  </div>

<script>
  const phrases = [
    "Remember, you're the best.",
    "You've got this.",
    "Breathe. You're doing better than you think.",
    "One step at a time, and you're already moving.",
    "You are capable today too.",
    "Trust yourself, I already do.",
    "You're handling this better than you realize.",
    "You're going to get through this one too.",
    "You are the best Paty",
    "Keep going, you're on the right track.",
    "Take a breath and keep going with everything you've got.",
    "No one said it would be easy, but you can do it.",
    "You're capable of more than you imagine.",
    "That effort shows, don't stop now.",
    "A little more and you've got it.",
    "You've already gotten through harder things.",
    "Danny says he loves you.",
    "Danny is sending out all the best vibes.",
    "Do it for Benjamin.",
    "You are a baddie.",
    "Your outfit looks amazing.",
    "I love how your nails look.",
    "Don't forget to take a selfie today.",
    "Don't forget to drink water.",
    "You are perfect.",
    "Wow, you have a huge ass.",
    "Danny sends you a lot of kisses.",
    "Zib zub zab."
  ];

  let deck = [];
  function refillDeck(){
    deck = [...phrases];
    for(let i = deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  refillDeck();

  const bubble = document.getElementById('bubble');
  const btn = document.getElementById('ctaBtn');
  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon');
  const soundLabel = document.getElementById('soundLabel');
  const photoFrame = document.getElementById('photoFrame');
  const talkRing = document.getElementById('talkRing');

  let talkSafety = null;
  function startTalking(){
    photoFrame.classList.add('talking');
    talkRing.classList.add('talking');
  }
  function stopTalking(){
    photoFrame.classList.remove('talking');
    talkRing.classList.remove('talking');
    window.clearTimeout(talkSafety);
  }
  function talkFor(text){
    startTalking();
    window.clearTimeout(talkSafety);
    const ms = Math.min(7000, Math.max(1200, text.length * 70));
    talkSafety = window.setTimeout(stopTalking, ms);
  }

  let soundOn = true;
  let enVoice = null;

  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if(!voices.length) return;
    enVoice =
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en') && /female|samantha|victoria|karen|moira|tessa|zira/i.test(v.name)) ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
      voices[0];
  }
  if('speechSynthesis' in window){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function speakBrowser(text){
    if(!('speechSynthesis' in window)){ stopTalking(); return; }
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if(enVoice) utter.voice = enVoice;
      utter.lang = enVoice ? enVoice.lang : 'en-US';
      utter.rate = 1;
      utter.pitch = 1.05;
      utter.onend = stopTalking;
      utter.onerror = stopTalking;
      window.speechSynthesis.speak(utter);
    }catch(e){ stopTalking(); }
  }

  // Tries the higher-quality /api/speak voice (only live once deployed on
  // Vercel with an API key set). Falls back to the browser's built-in
  // voice if that route isn't there or fails — so this also still works
  // straight from the Claude artifact preview.
  async function speak(text){
    if(!soundOn) return;
    try{
      const resp = await fetch('/api/speak?text=' + encodeURIComponent(text));
      if(resp.ok){
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => { URL.revokeObjectURL(url); stopTalking(); };
        audio.onerror = () => { URL.revokeObjectURL(url); speakBrowser(text); };
        await audio.play();
        return;
      }
    }catch(e){ /* no /api/speak here — fall back below */ }
    speakBrowser(text);
  }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundIcon.textContent = soundOn ? '🔊' : '🔇';
    soundLabel.textContent = soundOn ? 'Voice on' : 'Voice off';
    if(!soundOn){
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
      stopTalking();
    }
  });

  btn.addEventListener('click', () => {
    if(deck.length === 0) refillDeck();
    const next = deck.pop();

    bubble.classList.remove('show');
    window.setTimeout(() => {
      bubble.textContent = next;
      bubble.classList.add('show');
      talkFor(next);
      speak(next);
    }, 160);
  });

  window.setTimeout(() => { bubble.classList.add('show'); }, 300);
</script>
